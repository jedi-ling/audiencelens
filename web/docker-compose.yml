# 基础编排：backend + 用户前端 + 后台管理面板。
# 变量从同目录 .env 读取（模板见 .env.production.example）。
# 生产 TLS 叠加：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 这个文件是**部署产物**，不是本地开发入口（本地开发用 backend/run.py + vite，
# 见 backend/Dockerfile 里关于 8000/8001 的注释）。所以默认值按"生产"取：
#   - AL_ENV 默认 production（曾经默认 development，导致后端的生产自检永远不触发，
#     忘了 cp .env 也能正常起来、健康检查还通过——那才是最危险的状态）
#   - AL_JWT_SECRET 用 `${VAR:?...}` 声明为必填：没设就在 compose 解析阶段直接报错退出，
#     既不会起一个裸奔的栈，也不会留下一个反复重启的容器
#   - AL_AUTH_ENABLED 默认 true：关掉认证时所有访客共用一个 anonymous 身份，互相看得见
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 语义去重是构建期选择（装不装 sentence-transformers，+2GB）。
      # 默认 false；要开在 .env 写 INSTALL_SEMANTIC_DEDUP=true 后 --build。
      args:
        INSTALL_SEMANTIC_DEDUP: ${INSTALL_SEMANTIC_DEDUP:-false}
    ports:
      - "127.0.0.1:8000:8000"
    # 挂载点必须与容器内的仓库镜像布局一致（见 backend/Dockerfile 的 WORKDIR 说明）：
    # 容器里 <repo> = /app，所以 src 挂 /app/src、harness 挂 /app/audiencelens-v0.2-harness、
    # 数据目录挂 backend_dir/data。以前 harness 挂在 / 是为了迁就一个算错了的
    # PROJECT_ROOT，src 挂 /app/src 则两边都对不上——后端 import runner 直接失败。
    volumes:
      - ../src:/app/src:ro
      # 评委规则集（ethics/evaluation 服务启动时读取；缺失会降级为内置规则）
      - ../audiencelens-v0.2-harness:/app/audiencelens-v0.2-harness:ro
      - backend-data:/app/web/backend/data
    environment:
      - AL_ENV=${AL_ENV:-production}
      - AL_CORS_ORIGINS=${AL_CORS_ORIGINS:?必须设置正式域名（逗号分隔），例：AL_CORS_ORIGINS=https://example.com。见 .env.production.example}
      - AL_JWT_SECRET=${AL_JWT_SECRET:?必须设置强随机 JWT 密钥：openssl rand -hex 32。它只签登录态，不参与任何加密}
      # 落库 API Key 的加密密钥，**与 AL_JWT_SECRET 完全独立**：
      # 不设时回落的是 config.py 里的 DEV_ENCRYPTION_KEY（一个开发默认值），
      # 不是 AL_JWT_SECRET——JWT 密钥从来不用来加密 key。而且在类生产环境
      # （AL_ENV=production 或 CORS/站点地址指向公网）下，仍是开发默认值时
      # `_validate_startup` 会**直接拒绝启动**，不会悄悄裸奔（config.py:162 / :375）。
      # 一旦有用户存过 key 就不要再改这个值——改了 = 所有已存 key 解不开。
      - AL_ENCRYPTION_KEY=${AL_ENCRYPTION_KEY:-}
      - AL_ADMIN_TOKEN=${AL_ADMIN_TOKEN:-}
      - AL_AUTH_ENABLED=${AL_AUTH_ENABLED:-true}
      - AL_KEY_MODE=${AL_KEY_MODE:-byok}
      - AL_QUOTA_ENABLED=${AL_QUOTA_ENABLED:-false}
      - AL_QUOTA_MODE=${AL_QUOTA_MODE:-plan}
      - AL_QUOTA_FREE_REVIEWS_PER_DAY=${AL_QUOTA_FREE_REVIEWS_PER_DAY:-5}
      - AL_QUOTA_FREE_COST_USD_PER_DAY=${AL_QUOTA_FREE_COST_USD_PER_DAY:-1.0}
      # 下面这几项此前漏在白名单外。compose 用的是**显式 environment 白名单**、
      # 没有 env_file，而容器里也不存在 /app/web/.env（build context 是 ./backend），
      # 所以 config.py 那条 dotenv 回落救不了场——运维照 .env.production.example
      # 填了 AL_QUOTA_TOKENS_TOTAL=3000000，容器里读到的却是默认值 0 = 不限制，
      # 整条钱包闸静默关着。AL_SMTP_TIMEOUT_SECONDS 曾是同一个失效模式
      # （模板里诚实标注过"不生效"），现已一并补齐，见文件下半段。
      # 新增任何 AL_* 配置项时，必须同步加到这里，否则 Docker 下等于没加。
      - AL_QUOTA_TOKENS_TOTAL=${AL_QUOTA_TOKENS_TOTAL:-0}
      - AL_QUOTA_TOKENS_PER_REVIEW_ESTIMATE=${AL_QUOTA_TOKENS_PER_REVIEW_ESTIMATE:-150000}
      - AL_QUOTA_UNVERIFIED_REVIEWS_PER_DAY=${AL_QUOTA_UNVERIFIED_REVIEWS_PER_DAY:-1}
      - AL_SKILL_FREE_USES=${AL_SKILL_FREE_USES:-3}
      - AL_PREMIUM_SKILLS=${AL_PREMIUM_SKILLS:-red_team_audience}
      - AL_INTENT_MODEL=${AL_INTENT_MODEL:-claude-haiku-4-5-20251001}
      - AL_INTENT_LLM_ENABLED=${AL_INTENT_LLM_ENABLED:-true}
      - AL_RATELIMIT_ENABLED=${AL_RATELIMIT_ENABLED:-true}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AL_RATELIMIT_PER_MINUTE=${AL_RATELIMIT_PER_MINUTE:-60}
      - AL_RATELIMIT_REVIEW_PER_HOUR=${AL_RATELIMIT_REVIEW_PER_HOUR:-20}
      - AL_QUEUE_WORKERS=${AL_QUEUE_WORKERS:-2}
      - AUDIENCELENS_MAX_CONCURRENCY=${AUDIENCELENS_MAX_CONCURRENCY:-6}
      - AL_DATABASE_URL=${AL_DATABASE_URL:-}
      # 邮件：console 档不真发信（用户收不到验证/重置邮件）。
      # AL_AUTH_ENABLED=true 时后端会拒绝以 console 档启动，除非显式
      # 设 AL_ALLOW_CONSOLE_MAIL=true 表示"我知道且接受"。
      - AL_MAIL_BACKEND=${AL_MAIL_BACKEND:-console}
      - AL_MAIL_FROM=${AL_MAIL_FROM:-AudienceLens <noreply@localhost>}
      - AL_SMTP_HOST=${AL_SMTP_HOST:-}
      - AL_SMTP_PORT=${AL_SMTP_PORT:-587}
      - AL_SMTP_USER=${AL_SMTP_USER:-}
      - AL_SMTP_PASSWORD=${AL_SMTP_PASSWORD:-}
      - AL_SMTP_USE_SSL=${AL_SMTP_USE_SSL:-false}
      # 邮件里链接的落点。留空会指向 localhost，用户点了打不开。
      - AL_PUBLIC_WEB_URL=${AL_PUBLIC_WEB_URL:-}
      # 危险默认值的逃生舱（只在确实要这么跑时才设 true）
      - AL_ALLOW_SHARED_ANONYMOUS=${AL_ALLOW_SHARED_ANONYMOUS:-false}
      - AL_ALLOW_CONSOLE_MAIL=${AL_ALLOW_CONSOLE_MAIL:-false}
      # 游客身份 cookie（见 config.py「游客身份 cookie」一节）
      - AL_GUEST_COOKIE_NAME=${AL_GUEST_COOKIE_NAME:-al_guest}
      - AL_GUEST_COOKIE_SECURE=${AL_GUEST_COOKIE_SECURE:-true}
      - AL_GUEST_COOKIE_TTL_SECONDS=${AL_GUEST_COOKIE_TTL_SECONDS:-2592000}
      - AL_GUEST_IDENTITY_PER_HOUR=${AL_GUEST_IDENTITY_PER_HOUR:-30}
      # 付费档每日平台成本上限默认值（≈ 月价 / 30；后台面板可覆盖）
      - AL_PLAN_PRO_COST_USD_PER_DAY=${AL_PLAN_PRO_COST_USD_PER_DAY:-0.63}
      - AL_PLAN_TEAM_COST_USD_PER_DAY=${AL_PLAN_TEAM_COST_USD_PER_DAY:-1.63}
      # ---------------------------------------------------------------
      # 下面这一整段是补齐上面那条「新增任何 AL_* 配置项时必须同步加到这里」
      # 长期没被执行的欠账：config.py 一共读 52 个变量，这里曾经只列出 35 个。
      # 漏项在 Docker 下的表现不是报错，而是**静默用默认值**——最贵的一例是
      # QQ 登录：三个变量一个都传不进去，config.py 的 qq_login_enabled 永远为
      # false，后台怎么配都不出按钮，而 MAINTENANCE.md 把它写成已交付功能。
      #
      # 写默认值而不是一律 `:-` 留空：compose 的 `${VAR:-}` 会把变量设成**空串**，
      # 空串不是「未设置」。`_bool("AL_LEDGER_ENABLED", True)` 收到空串返回
      # False（判断留档整个关掉）、`os.environ.get("AL_UPLOAD_DIR", 默认)` 收到
      # 空串就真的用空路径。所以凡是「空串会改变行为」的项，这里都写死真实默认值，
      # 与 config.py 逐项对齐，由 tests/test_public_claims.py::test_compose_env_matches_config
      # 守着不再漏。
      # ---------------------------------------------------------------
      # 运行期开关
      - AL_DEBUG=${AL_DEBUG:-false}
      # 镜像里没有 /app/web/.env（build context 是 ./backend），dotenv 回落本来就
      # 加载不到任何东西；列在这里只是为了让「compose 与 config.py 逐项对齐」成立。
      - AL_SKIP_DOTENV=${AL_SKIP_DOTENV:-}
      - AL_LEDGER_ENABLED=${AL_LEDGER_ENABLED:-true}
      - AL_QUEUE_BACKEND=${AL_QUEUE_BACKEND:-inprocess}
      # 令牌有效期（秒）：登录态 7 天、邮箱验证 24 小时、密码重置 1 小时
      - AL_JWT_TTL_SECONDS=${AL_JWT_TTL_SECONDS:-604800}
      - AL_EMAIL_TOKEN_TTL_SECONDS=${AL_EMAIL_TOKEN_TTL_SECONDS:-86400}
      - AL_RESET_TOKEN_TTL_SECONDS=${AL_RESET_TOKEN_TTL_SECONDS:-3600}
      # 邮件：outbox 档把信写成文件而不发出去（留空 = 不启用）；SMTP 超时秒数
      - AL_MAIL_OUTBOX_DIR=${AL_MAIL_OUTBOX_DIR:-}
      - AL_SMTP_TIMEOUT_SECONDS=${AL_SMTP_TIMEOUT_SECONDS:-15}
      # QQ 互联登录。三项配齐 qq_login_enabled 才为真，前端才画那个按钮。
      # 回调地址要与 QQ 互联后台登记的完全一致，例：https://你的域名/api/auth/qq/callback
      - AL_QQ_APP_ID=${AL_QQ_APP_ID:-}
      - AL_QQ_APP_KEY=${AL_QQ_APP_KEY:-}
      - AL_QQ_REDIRECT_URI=${AL_QQ_REDIRECT_URI:-}
      # 上传：默认目录落在 backend-data 卷里（/app/web/backend/data），不写死
      # 的话容器重建会丢文件。大小单位是字节（10 MiB / 8 MiB）。
      - AL_UPLOAD_DIR=${AL_UPLOAD_DIR:-/app/web/backend/data/uploads}
      - AL_UPLOAD_MAX_BYTES=${AL_UPLOAD_MAX_BYTES:-10485760}
      - AL_UPLOAD_ALLOWED_EXT=${AL_UPLOAD_ALLOWED_EXT:-.txt,.md,.json,.yaml,.yml}
      - AL_UPLOAD_ALLOWED_IMAGE_EXT=${AL_UPLOAD_ALLOWED_IMAGE_EXT:-.png,.jpg,.jpeg,.webp,.gif}
      - AL_UPLOAD_MAX_IMAGE_BYTES=${AL_UPLOAD_MAX_IMAGE_BYTES:-8388608}
    # 指向 /api/health/ready 而不是 /api/health：后者返回的 "ok" 是写死的字符串，
    # 数据库挂掉、磁盘满、连接池耗尽时它照样 200，容器会一直被判定为 healthy
    # ——编排器不会有任何反应，而用户那边每个页面都在报错。
    # ready 会真打一次 SELECT 1，不可用时返回 503（urlopen 收到 503 抛 HTTPError，
    # 非零退出，healthcheck 因此判定失败）。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_AL_LOCALES 是构建期变量（build.args），不是 environment——写在
      # environment 里对已经打包好的静态文件毫无作用，改了 .env 也要
      # `--build` 重新构建才会生效，这跟 backend 那些运行时读的 AL_* 开关
      # 完全是两回事。默认给 zh,en：中英双语已经过全站验证（i18n:check /
      # 落地页能力声明测试 / 浏览器实测），可以直接对外。
      args:
        VITE_AL_LOCALES: ${VITE_AL_LOCALES:-zh,en}
        # 本实例自己的 ICP 备案号（构建期）；留空则页脚与条款页不显示备案信息
        VITE_ICP_TEXT: ${VITE_ICP_TEXT:-}
    ports:
      # 默认直接占 80（无 TLS 的裸跑）。上 Caddy 时在 .env 设
      # FRONTEND_BIND=127.0.0.1:8080 让出公网 80/443，由 Caddy 终结 TLS。
      - "${FRONTEND_BIND:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 运营后台：只绑本机回环，不暴露公网。
  # 远程访问走 SSH 隧道：ssh -L 5200:127.0.0.1:5200 服务器 → 浏览器开 http://localhost:5200
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
