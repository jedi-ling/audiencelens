server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 后台只用 /api/admin/*，但同源代理整个 /api/ 更简单；
    # 鉴权由 backend 的 X-Admin-Token 把关，这里不做额外访问控制——
    # 访问控制在 compose 层：端口只绑 127.0.0.1，公网根本摸不到。
    # 同前端 nginx.conf 的注释：默认 1m 上限会在图片到达后端前就 413，
    # admin 端也走同一个 /api/uploads
    location /api/ {
        client_max_body_size 10m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
