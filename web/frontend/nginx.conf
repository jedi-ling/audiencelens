server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy（HIGH-3 防御纵深）。
    # 落地页正文是构建期打包进 bundle 的静态 HTML（landing-body.html ?raw 导入），
    # 经 dangerouslySetInnerHTML 注入、不涉及任何用户输入——本身不是 XSS 向量。
    # 这里加 CSP 是为了万一别处出现注入时仍能阻断脚本执行：
    #   · script-src 'self'：禁止内联脚本与内联事件处理器（落地页的内联 onerror 已移除，
    #     改由 LandingPage.tsx 挂 error 监听），只允许同源模块脚本。
    #   · style-src 'unsafe-inline'：Tailwind 与内联 style 属性需要，风险由 script-src 兜住。
    #   · object-src 'none' / frame-ancestors 'none'：禁插件与被嵌套。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # nginx 默认 client_max_body_size 是 1m——后端图片上传上限是 8MB
    # (AL_UPLOAD_MAX_IMAGE_BYTES)，任何正常大小的截图都会在到达 FastAPI
    # 之前就被 nginx 用 413 拦下，且前端拿到的是连接被重置/空响应，不是
    # 后端那句"图片超过上限 8 MB"的清晰报错——所以用户只会看到"发不出去"。
    location /api/ {
        client_max_body_size 10m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 这一行以前没有，只递了 X-Real-IP —— 而 uvicorn 的 --proxy-headers
        # 认的是 X-Forwarded-For，不认 X-Real-IP。结果是后端看到的 client.host
        # 永远是 nginx 容器的 IP，限流从"每 IP N 次"退化成"全站 N 次"：
        # 任意一人注册 10 次就能让所有人一小时内注册不了、登录不了
        # （register 与 login 共用同一个限流桶）。
        #
        # 用 $remote_addr 而不是 $proxy_add_x_forwarded_for：后者会把客户端
        # 自己带来的 XFF 原样接在前面，而 uvicorn 取的是链条最左边那个——
        # 于是任何人只要伪造一个 X-Forwarded-For 头就能换一个限流桶，
        # 限流形同虚设。这里只写我们自己观测到的对端地址，客户端伪造的部分丢弃。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
