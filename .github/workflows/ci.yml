name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  core-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Core engine tests (267)
        run: python -m pytest tests/ -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r web/backend/requirements.txt pytest pytest-asyncio
      - name: Backend tests (173)
        working-directory: web/backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - name: Build ${{ matrix.app }}
        working-directory: web/${{ matrix.app }}
        run: |
          npm ci
          npm run build
