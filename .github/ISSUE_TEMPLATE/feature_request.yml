name: 功能请求
description: 为 AudienceLens 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 功能描述
        请描述你想要的功能或改进。

  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题？
      description: 这个功能解决什么问题？为什么需要它？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你希望如何实现这个功能？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有考虑过其他解决方案？
