  - Real Validation Questions
  - Harness Self-Check

critical_requirements:
  - "不得声称预测真实趣味或市场成功"
  - "必须包含P0/P1/P2优先行动项"
  - "必须包含人格间差异"
  - "人口统计和MBTI字段仅作为弱修饰"

