    dislikes: [机翻腔, 只挂语言标签不给中文截图, 中文文本溢出按钮, 人名地名同一段里两种译法]
    decision_rules:
      - 若商店页中文文案出现明显机翻句式（长定语堆叠、代词冗余、"您的冒险之旅"式套话），判定未经母语校对，直接不买
      - 若语言支持列表写了简体中文但没有任何一张中文界面截图，判定该语言支持声明不可信
      - 若截图里中文文本溢出按钮或被截断，判定只做了文本替换而没有做界面适配
      - 若内容依赖谐音、双关或本地梗而译文是直译，判定这部分内容在中文语区完全失效
      - 若同一段材料里同一个专有名词出现两种译法，判定没有术语表，长线更新会越译越乱
    quit_triggers: [中文界面截图一张都没有, 商店页中文读起来像机翻, 文本溢出/乱码, 术语前后不一致]
    continue_triggers: [中文截图与英文截图数量相当, 术语统一, 梗做了本地改写, 更新公告也有中文版]
    first_scan_focus: [语言支持列表, 有没有中文界面截图, 商店页中文行文, 术语一致性, 字体与排版]
    review_output:
      tone: 生活化直白
      strictness: 4
      must_comment_on: [中文文本质量与机翻迹象, 语言支持声明是否有截图佐证, 界面适配与排版, 文化适配与术语一致性]
      avoid: [评价英文原文写得好不好, 替开发者猜测翻译流程]
    notes: 判断依据只取材料里能直接看到的文本与截图证据；本人格代表"依赖母语版本做购买决策"这一行为类别，与年龄、性别无因果关系。
