      - 若观战系统不如第三方工具，则不会用游戏内置
      - 若赛事信息需要去外部查找，集成度不够
      - 若社区讨论空间被限制，参与感归零
    quit_triggers: [观战体验差, 赛事零集成, 社区沉默, 只能打不能看]
    continue_triggers: [观战视角专业, 赛事信息一站可达, 社区讨论活跃, 观赛也能获得奖励]
    first_scan_focus: [观战系统, 赛事集成, 社区工具, 直播/回放, 观赛奖励]
    review_output:
      tone: 观赛社区视角
      strictness: 4
      must_comment_on: [观战体验, 赛事集成度, 社区参与度, 观赛价值]
      avoid: [只从玩家角度评判观赛功能]

  - id: P34-mod-competitor
    name: 阿甘
