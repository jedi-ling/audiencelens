# AudienceLens Harness v0.3 默认阈值配置
# 注意：这些阈值是原型值，未经实证验证

actionability:
  min_ratio: 0.70
  weight: 1.0
  description: "≥70% 的建议包含具体步骤"

input_grounding:
  min_citation_ratio: 0.80
  min_direct_ratio: 0.60
  weight: 1.0
  description: "≥80% 的主张引用输入证据；直接证据比例 ≥60%"

persona_differentiation:
  min_jaccard: 0.30
  weight: 1.0
  description: "平均 Jaccard 距离 ≥0.3"

stereotype_check:
  max_violations: 0
  weight: 1.5
  description: "零人口统计因果推理模式"

structural_integrity:
  min_section_coverage: 1.0
  weight: 1.0
  description: "100% 的必需章节存在"

calibration_honesty:
  min_annotation_ratio: 1.0
  weight: 1.2
  description: "100% 的假设正确标注"

risk_detection:
  min_critical_issues: 1
  weight: 1.0
  description: "≥1 个关键/高严重性问题"

segment_conflict:
  min_disagreements: 2
  weight: 1.0
  description: "≥2 个有意义的分歧"

# 评分规则
scoring:
  fail_max: 1
  needs_improvement_max: 3
  pass_min: 4
  overall_pass_min_avg: 3.0
  overall_pass_min_per_dim: 2
