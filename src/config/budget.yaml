version: 0.1.0
max_cost_per_run_usd: 2.0
# 真实 Anthropic 模型 ID——早期版本这里写的是 "claude-sonnet" 这种占位别名，
# 传给 Anthropic API 会直接 404。见 src/runner/llm_client.py 的调用点。
#
# 2026-09-14 核对 platform.claude.com/docs/en/about-claude/pricing 与 models/overview：
# Sonnet 4 / Opus 4 已在官方 API **退役**（只剩 Bedrock/Google Cloud 还挂着），
# 继续写它们等于默认配置在官方端点上打不通。4.6 代起模型 ID 不带日期后缀，
# 无日期 ID 本身就是固定快照。BYOK 用户填自己的 ID 即可覆盖这里的默认值。
default_model: claude-sonnet-5
fallback_model: claude-haiku-4-5-20251001
premium_model: claude-opus-5
# 不在下面 model_pricing 里的模型按这个价估（比如 BYOK 用户或后台配的第三方
# OpenAI 兼容模型）。**不能留空或按 0 算**：成本恒 0 会让 quota_service 的
# 24 小时成本硬闸永远不触发、后台成本面板恒显示 $0，且完全静默。
# 默认取最贵一档，宁可高估——高估只让闸提前触发，低估等于没有闸。
# 想要准确数字就在 model_pricing 里给该模型补一条真实单价。
unknown_model_pricing:
  input_per_mtok: 15.0
  output_per_mtok: 75.0
# 单价核对于 2026-09-14（官方定价页）。Sonnet 5 的 $2/$10 原是限时价，官方已
# 宣布转为正式价，不再上调。缓存读写的倍率（写 1.25x / 读 0.1x）不在这里配——
# 它是 persona_agent.CACHE_WRITE/READ_PRICE_MULTIPLIER 里的常量，只在算钱那一步
# 生效。llm_client 返回的 input_tokens 是**真实 token 数**（落库当用量统计用），
# 不要再把折扣折进 token 数里：那样缓存命中的 token 在用量面板上会凭空少 90%。
model_pricing:
  claude-haiku-4-5-20251001:
    input_per_mtok: 1.0
    output_per_mtok: 5.0
  claude-haiku-4-5:
    input_per_mtok: 1.0
    output_per_mtok: 5.0
  claude-sonnet-5:
    input_per_mtok: 2.0
    output_per_mtok: 10.0
  # Sonnet 5.5：与 Sonnet 5 同价（$2 / $10，缓存读 $0.20 = 0.1x），2026-11-04 核对。
  claude-sonnet-5-5:
    input_per_mtok: 2.0
    output_per_mtok: 10.0
  claude-opus-5:
    input_per_mtok: 5.0
    output_per_mtok: 25.0
  # 上一代仍可能被 BYOK 用户手填（Bedrock/GCP 上还在），留着让成本算得准
  claude-sonnet-4-6:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  claude-sonnet-4-5-20250929:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  claude-sonnet-4-20250514:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  claude-opus-4-20250514:
    input_per_mtok: 15.0
    output_per_mtok: 75.0
  # MiniMax 官方 anthropic 兼容端点（试点样例评审用）。键名必须与传入的模型 ID
  # 逐字一致（resolve_model_pricing 是区分大小写的精确匹配）。单价 2026-10-20
  # 核对于 cc-switch 的 model-pricing.json（与 MiniMax 开放平台公示一致）：
  # 输入 $0.3/M、输出 $1.2/M；缓存读约 $0.06/M，M3 缓存写不计费——引擎统一按
  # CACHE_WRITE/READ 倍率折算，与该口径略有出入，属可接受的估算误差。
  MiniMax-M3:
    input_per_mtok: 0.3
    output_per_mtok: 1.2
# 人格评审的重试。**这一段的每个键都有真实读取点**：src/runner/cli.py 的
# _retry_settings 读取并解析它，run_single_persona 拿到解析结果后在同一层统一
# 执行最多 max_retries 次重试（重试预算只有这一套，覆盖 transport_error /
# schema_failure / role_drift / hallucination 四类，哪几类重试由 retry_on 决定）。
# llm_client.chat_completion 的 max_retries/backoff 参数保留给独立调用方，引擎
# 链路不叠它——传输层重试由 run_single_persona 的循环统一计数，避免两套预算。
# 在这里加旋钮之前，先确认代码里真有人读。
#
# 历史：这一段曾经声称"每位人格最多重试 3 次，遇到 schema_failure / role_drift /
# hallucination 就重试"，还有一行 alert_on: [low_disagreement, time_drift]，
# 而全仓库（src/ 与 web/backend/）对它们是**零读取点**——瞬时网络抖动照样让人格
# 直接失败，谁也不会被 alert。alert_on 没有任何告警通道可接，按事实删除；
# 其余三项改成真生效。
#
# retry_on 可选值（其余值会被忽略）：
#   transport_error —— 网络/限流/5xx 等瞬时故障（不含 401、余额不足这类死错）
#   schema_failure  —— 模型返回无法解析，或输出不满足 output-schema 的关键字段
#   role_drift      —— must_comment_on 覆盖率过低 / 推断比例过高
#   hallucination   —— direct 证据在材料里找不到出处
# 默认只开前两项：role_drift 和 hallucination 是**输出质量**信号而不是"这次调用
# 坏了"，重跑一次未必更好，但每次重试都是一整轮人格调用的钱。想开的人自己权衡。
retry:
  # 每位人格最多重试 1 次。schema_failure / hallucination 的重试不是原样重发，
  # 而是一轮修复对话：把校验器的具体错误（缺哪些字段 / 哪几条 direct 证据在原文里
  # 找不到）回喂给模型，要求它重新交卷（src/runner/cli.py::_repair_feedback）。
  # 2026-11-04 诊断：原样重发 3 次，同一位人格每次交回同一种残缺输入，钱白花。
  max_retries_per_persona: 1
  retry_on: [transport_error, schema_failure, hallucination]
  # 指数退避基数（秒）：第 n 次重试等 backoff * 2^n + 随机抖动
  backoff_base_seconds: 1.0
